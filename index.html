<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>FomeLand Launcher</title>
    <!-- CSP para evitar advertencias de Electron y permitir peticiones de novedades -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com;" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="main-layout">

        <!-- Panel Izquierdo: Novedades -->
        <div class="news-panel">
            <h2>NOVEDADES</h2>
            <div class="changelog-list" id="changelog-container">
                <!-- Se llena dinámicamente con renderer.js -->
            </div>
        </div>

        <!-- Panel Derecho: TU ESTRUCTURA HTML FUNCIONAL EXACTA -->
        <div class="container">

            <img class="logo" src="assets/logo.ico" alt="FomeLand Logo" />

            <h1>FomeLand</h1>

            <input type="text" id="username" placeholder="Tu nombre de usuario" />

            <br />

            <button id="play">JUGAR</button>

            <p id="status"></p>

            <span class="version" id="launcher-version">v1.0.3</span>

        </div>

    </div>

    <script src="renderer.js"></script>
</body>
</html>
